[project]
name = "exist-2026"
version = "0.1.0"
description = "AI Wizards implementation for the EXIST 2026 hierarchical sexism identification in memes task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=2.2,<3.0",
    "pytorch-lightning>=2.6.1",
    "seaborn>=0.13.2",
    "transformers[torch]>=5.5.4",
    "wandb>=0.25.1",
    "scikit-learn",
    "torch",
    "torchvision",
    "torchaudio",
    "PyEvALL",
    "tensorboard"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.black]
line-length = 120
target-version = ['py312']
